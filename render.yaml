services:
  - type: web
    name: adoraplus
    runtime: node
    plan: free
    buildCommand: npm run render-build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: adoraplus-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: VITE_ENABLE_REMOTE_STORAGE
        value: "true"
      - key: VITE_ADMIN_EMAIL
        placeholder: "admin@example.com"
      - key: VITE_ADMIN_PASSWORD
        generateValue: true
      - key: NODE_VERSION
        value: "20"

databases:
  - name: adoraplus-db
    plan: free
