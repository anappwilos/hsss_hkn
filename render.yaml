services:
  - type: web
    name: a-solas-api-json-v2
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: postgres
      - key: DATABASE_SSL
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: a-solas-db
          property: connectionString
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: VITE_ADMIN_PASSWORD
        sync: false
      - key: VITE_SUPERADMIN_EMAIL
        sync: false
      - key: VITE_SUPERADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: static
          name: a-solas-static-web
          property: url

  - type: static
    name: a-solas-static-web
    buildCommand: npm install && npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: a-solas-api-json-v2
          property: url
      - key: VITE_ENABLE_REMOTE_STORAGE
        value: "true"

databases:
  - name: a-solas-db
    plan: free
