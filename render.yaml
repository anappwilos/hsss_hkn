services:
  - type: web
    name: adoraplus
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_ENABLE_REMOTE_STORAGE
        value: "true"
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: VITE_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: adoraplus-db
          property: connectionString

databases:
  - name: adoraplus-db
    plan: free
    databaseName: adoraplus
    user: adoraplus
