services:
  - type: web
    name: a-solas
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: VITE_ADMIN_PASSWORD
        sync: false
      - key: VITE_SUPERADMIN_EMAIL
        sync: false
      - key: VITE_SUPERADMIN_PASSWORD
        sync: false
      - key: STORAGE_DRIVER
        value: json
      - key: JSON_DATA_FILE
        value: /tmp/a-solas-state.json
