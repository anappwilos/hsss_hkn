services:
  - type: web
    name: a-solas-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_ENABLE_REMOTE_STORAGE
        value: "true"
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: VITE_ADMIN_PASSWORD
        sync: false
      - key: VITE_SUPERADMIN_EMAIL
        sync: false
      - key: VITE_SUPERADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: a-solas-db
          property: connectionString

  - type: static
    name: a-solas-web
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false

databases:
  - name: a-solas-db
    plan: free
    postgresMajorVersion: "16"
    databaseName: a_solas
    user: a_solas
