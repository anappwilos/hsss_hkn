services:
  - type: web
    name: a-solas
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_ENABLE_REMOTE_STORAGE
        value: "true"
      - key: VITE_ADMIN_EMAIL
        sync: false
      - key: VITE_ADMIN_PASSWORD
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: PGSSLMODE
        value: "require"
      - key: DATABASE_URL
        fromDatabase:
          name: a-solas-db
          property: connectionString

databases:
  - name: a-solas-db
    plan: free
    databaseName: a_solas
    user: a_solas
