services:
  postgres:
    image: postgres:16
    container_name: adoraplus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: adoraplus
      POSTGRES_USER: adoraplus
      POSTGRES_PASSWORD: adoraplus_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adoraplus -d adoraplus"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
